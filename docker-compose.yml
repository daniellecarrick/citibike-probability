services:
  backend:
    build: ./backend
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/citibike.db
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_MAPBOX_TOKEN=${MAPBOX_TOKEN}
